<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fruit Party Video Maker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>🍓 Fruit Party</h1>

    <div class="steps">
      <div class="step">
        <label for="file">Upload audio</label>
        <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.oga,.flac,.opus,.webm,.mp4">
      </div>
      <button id="generate" disabled>Generate</button>
    </div>
    <p id="status">Choose a song, then press Generate.</p>

    <section id="stage" hidden>
      <canvas id="video" width="1280" height="720"></canvas>
      <div class="transport">
        <button id="play">❚❚ Pause</button>
        <span id="time">0:00 / 0:00</span>
        <button id="save" class="quiet">Save video</button>
        <a id="download" hidden>⬇ Download video</a>
      </div>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
